# Publishes every library of a version (its tag, v0.1.0…), each registry behind the « publication » environment
# (the owner approves each run). No key kept here for PyPI, RubyGems and NuGet: their Trusted Publishing (OIDC).
# npm: a token for the very first publication (secret NPM_TOKEN), then its Trusted Publishing. Maven Central: its
# token and a signing key (secrets MAVEN_CENTRAL_USER, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_KEY, MAVEN_GPG_PASSPHRASE).
# Go: nothing to publish (its tag go/v0.1.0 makes the version). PHP: Packagist reads its own repository.
name: Publier
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: publication
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm publish --provenance --access public
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  pypi:
    runs-on: ubuntu-latest
    environment: publication
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: python -m pip install build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
  rubygems:
    runs-on: ubuntu-latest
    environment: publication
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: rubygems/configure-rubygems-credentials@v2
      - run: gem build ished.gemspec && gem push ished-*.gem
        working-directory: ruby
  nuget:
    runs-on: ubuntu-latest
    environment: publication
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - run: dotnet pack dotnet/Ished/Ished.csproj -c Release -o out
      - uses: NuGet/login@v1
        id: login
        with: { user: ${{ vars.NUGET_USER }} }
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
  maven:
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USER
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn -B -P publication deploy
        working-directory: java
        env:
          MAVEN_CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
